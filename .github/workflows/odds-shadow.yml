name: Quote shadow v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan oppure collect"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - collect
      date:
        description: "YYYY-MM-DD opzionale"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa OddsHarvester
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui Quote Shadow
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            python shadow.py "${{ inputs.mode }}" --date "${{ inputs.date }}"
          else
            python shadow.py "${{ inputs.mode }}"
          fi

      - name: Salva i dati
        run: |
          git config user.name "quote-shadow-bot"
          git config user.email "quote-shadow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "data: aggiorna Quote Shadow"
            git push
          fi
