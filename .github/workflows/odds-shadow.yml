name: APIfootball shadow v2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: apifootball-shadow-v2
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Raccogli quote
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python apifootball_github.py

      - name: Salva dati
        run: |
          git config user.name "quote-shadow-bot"
          git config user.email "quote-shadow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "data: snapshot APIfootball"
            git pull --rebase
            git push
          fi
