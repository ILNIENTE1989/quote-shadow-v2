name: Cloudbet shadow v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudbet-shadow-v2
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Raccogli quote Cloudbet
        run: python cloudbet_github.py

      - name: Salva dati
        run: |
          git config user.name "quote-shadow-bot"
          git config user.email "quote-shadow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "data: snapshot Cloudbet"
            git pull --rebase
            git push
          fi
